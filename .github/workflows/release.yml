name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The build jobs run in parallel; if each of them created the release itself,
  # they could race and end up uploading into separate drafts
  create-release:
   name: Create draft release
   runs-on: ubuntu-latest
   steps:
    - name: Create draft release if missing
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | .id')
        if [ -z "$existing" ]; then
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "${TAG#v}" --notes ""
        fi

  build:  
   name: Release ${{ matrix.os }}
   needs: create-release
   runs-on: ${{ matrix.os }}    
   strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
   steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24

    - name: Install pnpm
      uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      with:
        version: 11.1.2

    - name: Install Linux packaging tools
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm run lint

    - name: Security audit
      run: pnpm run security:audit

    - name: Build & Publish Release
      run: pnpm run package
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
