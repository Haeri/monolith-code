<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>monolith code</title>

    <!-- Deferred scripts run in order once the document is parsed -->
    <script src="res/lib/ace-builds-1.44.0/src-min/ace.js" defer></script>
    <script src="res/lib/ace-builds-1.44.0/src-min/ext-modelist.js" defer></script>
    <script src="res/lib/ace-builds-1.44.0/src-min/ext-language_tools.js" defer></script>
    <script src="res/lib/ace-builds-1.44.0/src-min/ext-themelist.js" defer></script>
    <script src="src/common.js" defer></script>
    <script src="src/monolith.js" defer></script>

    <link rel="stylesheet" href="res/style/style.css">
    <link rel="stylesheet" href="res/style/bars.css">

    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; font-src 'self'; object-src 'none'; base-uri 'none';">
</head>

<body>
    <div id="container">
        <header>
            <span id="document-name">new document</span>
            <div id="window-buttons">
                <button id="pin-button"></button>
                <button id="max-button"></button>
                <button id="min-button"></button>
                <button id="close-button"></button>
            </div>
        </header>
        <div id="content">
            <div id="main-divider">
                <div id="editor-wrapper">
                    <pre id="main-text-area"></pre>
                </div>
                <div id="editor-media-div" class="resizer" data-direction="horizontal"></div>
                <div id="preview-wrapper">
                    <webview id="embed-content" src="about:blank" preload="res/embed/preload.js"></webview>
                    <div id="preview-dev-div" class="resizer" data-direction="vertical"></div>
                    <webview id="embed-content-dev-view" src="about:blank"></webview>
                </div>
            </div>
            <div id="editor-console-div" class="resizer" data-direction="vertical"></div>
            <div id="console">
                <pre id="console-out"></pre>
                <textarea id="console-in" spellcheck="false"></textarea>
                <span id="process-indicator"></span>
            </div>
        </div>
        <footer>
            <span id="char-display"></span>
            <div class="select-box" id="language-display">
                <div class="selected" tabindex="0" role="combobox" aria-label="Language" aria-controls="language-options" aria-haspopup="listbox" aria-expanded="false"></div>
                <div class="panel options-container" id="language-options" role="listbox" aria-label="Language"></div>
            </div>
        </footer>
        <div id="status-display">
            <span id="status-bar"></span>
        </div>

        <div class="overlay" id="settings-overlay">
            <div class="panel">
                <select id="theme-choice"></select>
                <div>
                    <input type="checkbox" name="settings-line-wrap" id="settings-line-wrap">
                    <label for="settings-line-wrap">Line wrap</label>
                </div>
                <div>
                    <input type="checkbox" name="settings-line-numbers" id="settings-line-numbers">
                    <label for="settings-line-numbers">Line numbers</label>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
